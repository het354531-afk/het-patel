    function setBoard(board, btn) {
        currentBoard = board;
        btn.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards();
    }

    function setSubject(subject, btn) {
        currentSubject = subject;
        document.getElementById('subjectButtons').querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards();
    }

    function renderCards() {
        const container = document.getElementById('cardsContainer');
        const query = document.getElementById('searchInput').value.toLowerCase();
        const items = revisionData[currentBoard][currentSubject] || [];
        container.innerHTML = '';

        const filtered = items.filter(item => 
            item.title.toLowerCase().includes(query) || 
            item.tag.toLowerCase().includes(query) ||
            item.points.some(p => p.toLowerCase().includes(query)) ||
            (item.trick && item.trick.toLowerCase().includes(query))
        );

        if (filtered.length === 0) {
            container.innerHTML = `<div class="rev-card" style="text-align:center; color:#94a3b8;">કોઈ પરિણામ મળ્યું નથી. બીજો શબ્દ સર્ચ કરો.</div>`;
            return;
        }

        filtered.forEach(item => {
            const pointsHTML = item.points.map(p => `<li>${p}</li>`).join('');
            const trickHTML = item.trick ? `<div class="trick-box">${item.trick}</div>` : '';
            container.innerHTML += `
                <div class="rev-card">
                    <div class="card-header">
                        <div class="card-title">${item.title}</div>
                        <span class="tag">${item.tag}</span>
                    </div>
                    <div class="card-content">
                        <ul>${pointsHTML}</ul>
                        ${trickHTML}
                    </div>
                </div>
            `;
        });
    }

    renderCards();
</script>
