<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Car Parking 100</title>
<style>
  body { margin: 0; background: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: Arial; }
  #top { display: flex; justify-content: space-between; width: 310px; margin-bottom: 8px; color: #ffeb3b; font-size: 18px; font-weight: bold; }
  button.top { background: #4caf50; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-weight: bold; }
  canvas { background: #263238; border: 4px solid #fff; border-radius: 8px; }
  .controls { display: flex; justify-content: space-between; width: 310px; margin-top: 15px; }
  .box { display: flex; gap: 12px; }
  .btn { width: 65px; height: 60px; font-size: 24px; border-radius: 12px; border: none; background: #ff9800; color: white; font-weight: bold; }
  .blue { background: #2196f3; }
</style>
</head>
<body>

<div id="top">
  <span id="lvl">Level: 1 / 100</span>
  <button class="top" onclick="nextLvl()">Next ⏭</button>
</div>

<canvas id="c" width="310" height="420"></canvas>

<div class="controls">
  <div class="box">
    <button class="btn" ontouchstart="k.l=1" ontouchend="k.l=0" onmousedown="k.l=1" onmouseup="k.l=0">◀</button>
    <button class="btn" ontouchstart="k.r=1" ontouchend="k.r=0" onmousedown="k.r=1" onmouseup="k.r=0">▶</button>
  </div>
  <div class="box">
    <button class="btn blue" ontouchstart="k.d=1" ontouchend="k.d=0" onmousedown="k.d=1" onmouseup="k.d=0">▼</button>
    <button class="btn blue" ontouchstart="k.u=1" ontouchend="k.u=0" onmousedown="k.u=1" onmouseup="k.u=0">▲</button>
  </div>
</div>

<script>
const c = document.getElementById("c"), ctx = c.getContext("2d");
let level = 1, k = {u:0, d:0, l:0, r:0};
let car = {x: 60, y: 350, w: 30, h: 52, a: 0, s: 0};
let park = {x: 220, y: 30, w: 50, h: 70}, obs = [];

function load(n) {
  k = {u:0, d:0, l:0, r:0}; obs = [];
  let sx = (n % 3 === 1) ? 60 : (n % 3 === 2 ? 155 : 250);
  car = {x: sx, y: 360, w: 30, h: 52, a: 0, s: 0};
  let px = (n % 2 === 1) ? 225 : 35;
  park = {x: px, y: 30, w: 50, h: 72};
  obs.push({x: px > 100 ? px - 45 : px + 62, y: 38, w: 30, h: 52, col: "#e53935", vx: 0});
  obs.push({x: (n % 2 === 1) ? 20 : 140, y: 150, w: 140, h: 20, col: "#90a4ae", vx: 0});
  if (n >= 2) obs.push({x: 40, y: 245, w: 50, h: 26, col: "#ff5722", vx: Math.min(4, 1.5 + n * 0.03)});
  document.getElementById("lvl").innerText = "Level: " + n + " / 100";
}
function nextLvl() { level = level < 100 ? level + 1 : 1; load(level); }
load(1);

function loop() {
  if (k.u) car.s = 2.7; else if (k.d) car.s = -2.1; else car.s *= 0.85;
  if (Math.abs(car.s) > 0.2) {
    let dir = car.s > 0 ? 1 : -1;
    if (k.l) car.a -= 0.05 * dir;
    if (k.r) car.a += 0.05 * dir;
  }
  car.x += Math.sin(car.a) * car.s;
  car.y -= Math.cos(car.a) * car.s;

  if (car.x < 18 || car.x > 292 || car.y < 22 || car.y > 398) { alert("💥 અથડાયા!"); load(level); }
  for (let o of obs) {
    if (o.vx) { o.x += o.vx; if (o.x < 10 || o.x + o.w > 300) o.vx *= -1; }
    if (car.x + 12 > o.x && car.x - 12 < o.x + o.w && car.y + 18 > o.y && car.y - 18 < o.y + o.h) { alert("💥 કાર અથડાઈ!"); load(level); }
  }
  if (car.x > park.x + 8 && car.x < park.x + park.w - 8 && car.y > park.y + 12 && car.y < park.y + park.h - 12 && Math.abs(car.s) < 0.3) {
    alert("🎉 Level " + level + " જીત્યા!"); nextLvl();
  }

  ctx.clearRect(0, 0, 310, 420);
  ctx.strokeStyle = "#ffeb3b"; ctx.lineWidth = 4; ctx.strokeRect(park.x, park.y, park.w, park.h);
  ctx.fillStyle = "#ffeb3b"; ctx.font = "bold 26px Arial"; ctx.fillText("P", park.x + 16, park.y + 45);

  for (let o of obs) { ctx.fillStyle = o.col; ctx.fillRect(o.x, o.y, o.w, o.h); }

  ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.a);
  ctx.fillStyle = "#00b0ff"; ctx.fillRect(-15, -26, 30, 52);
  ctx.fillStyle = "#fff"; ctx.fillRect(-3, -24, 6, 48);
  ctx.fillStyle = "#111"; ctx.fillRect(-11, -15, 22, 12);
  ctx.restore();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
