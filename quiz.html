<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Std 10 Smart Quiz Portal (GSEB & CBSE) | Het Patel</title>
    <script data-goatcounter="https://goatcounter.com" async src="//gc.zgo.at/count.js"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Noto Sans Gujarati', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
        .container { background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 20px; max-width: 650px; width: 100%; padding: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
        .header { text-align: center; margin-bottom: 20px; }
        .badge { background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 5px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-bottom: 8px; }
        h1 { font-size: 1.5rem; color: #ffffff; margin-bottom: 4px; }
        .sub-title { font-size: 0.9rem; color: #94a3b8; }
        .setup-box { display: flex; flex-direction: column; gap: 16px; }
        .board-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .board-btn { padding: 12px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: #94a3b8; font-weight: 700; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .board-btn.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); color: #ffffff; }
        label { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 6px; display: block; font-weight: 600; }
        select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: #f8fafc; font-size: 1rem; outline: none; cursor: pointer; }
        select:focus { border-color: #38bdf8; }
        .stats-bar { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 16px; border-radius: 12px; margin-bottom: 14px; font-weight: 600; font-size: 0.9rem; }
        .chapter-tag { font-size: 0.85rem; color: #38bdf8; margin-bottom: 12px; font-weight: 600; }
        .progress-container { width: 100%; height: 8px; background: #334155; border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); width: 0%; transition: width 0.3s ease; }
        .question-box { font-size: 1.12rem; font-weight: 600; line-height: 1.6; margin-bottom: 18px; color: #f1f5f9; }
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #1e293b; border: 2px solid #334155; color: #f8fafc; padding: 13px 16px; border-radius: 12px; text-align: left; font-size: 0.98rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 10px; }
        .option-btn:hover:not(:disabled) { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .option-btn.correct { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #86efac; }
        .option-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #fca5a5; }
        .explanation { margin-top: 14px; padding: 12px 16px; background: rgba(56, 189, 248, 0.1); border-left: 4px solid #38bdf8; border-radius: 8px; font-size: 0.9rem; color: #e2e8f0; display: none; }
        .action-btn { margin-top: 16px; width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(90deg, #0284c7, #2563eb); color: white; font-size: 1.02rem; font-weight: 700; cursor: pointer; transition: transform 0.15s ease; }
        .action-btn:hover { transform: translateY(-2px); }
        .secondary-btn { background: #334155; margin-top: 10px; text-decoration: none; display: block; text-align: center; }
        .result-box { text-align: center; display: none; }
        .marks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
        .mark-card { background: #0f172a; border: 1px solid #334155; padding: 16px; border-radius: 14px; }
        .mark-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
        .mark-value { font-size: 1.8rem; font-weight: 700; color: #38bdf8; }
        .mark-value.obtained { color: #22c55e; }
        .grade-badge { display: inline-block; padding: 10px 20px; border-radius: 12px; font-size: 1.15rem; font-weight: 700; margin-bottom: 10px; }
        .grade-excellent { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .grade-good { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; }
        .grade-nice { background: rgba(250, 204, 21, 0.2); color: #facc15; border: 1px solid #eab308; }
        .grade-workhard { background: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .footer { margin-top: 20px; font-size: 0.85rem; color: #64748b; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="badge">🎓 Std 10 • GSEB & CBSE (1,640 MCQs)</div>
        <h1>સ્માર્ટ ચેપ્ટર-વાઇઝ MCQ ક્વિઝ</h1>
        <div class="sub-title">Smart Edu & Tech • Het Patel</div>
    </div>
    <div id="setup-area" class="setup-box">
        <div>
            <label>૧. તમારું બોર્ડ પસંદ કરો (Select Board):</label>
            <div class="board-toggle">
                <button class="board-btn active" id="btn-gseb" onclick="selectBoard('GSEB')">🇮🇳 GSEB (ગુજરાતી)</button>
                <button class="board-btn" id="btn-cbse" onclick="selectBoard('CBSE')">📘 CBSE (English)</button>
            </div>
        </div>
        <div>
            <label for="subject-select">૨. વિષય પસંદ કરો (Select Subject):</label>
            <select id="subject-select" onchange="updateChapters()"></select>
        </div>
        <div>
            <label for="chapter-select">૩. પ્રકરણ / યુનિટ પસંદ કરો (Select Chapter):</label>
            <select id="chapter-select"></select>
        </div>
        <button class="action-btn" onclick="startQuiz()">🚀 ક્વિઝ શરૂ કરો (Start Quiz)</button>
        <a href="index.html" class="action-btn secondary-btn">🏠 મુખ્ય વેબસાઇટ પર જાઓ</a>
    </div>
    <div id="quiz-area" style="display: none;">
        <div class="chapter-tag" id="active-chapter-title"></div>
        <div class="stats-bar">
            <span id="question-counter">પ્રશ્ન 1 / 10</span>
            <span id="score-counter">ગુણ: 0 / 10</span>
        </div>
        <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="question-box" id="question-text"></div>
        <div class="options-list" id="options-list"></div>
        <div class="explanation" id="explanation-box"></div>
        <button class="action-btn" id="next-btn" style="display: none;" onclick="nextQuestion()">આગળનો પ્રશ્ન ➔</button>
    </div>
    <div class="result-box" id="result-box">
        <h2 id="result-title">🎉 ક્વિઝ પૂર્ણ થઈ!</h2>
        <div class="marks-grid">
            <div class="mark-card"><div class="mark-label" id="total-marks-label">કુલ ગુણ</div><div class="mark-value" id="total-marks-val">0</div></div>
            <div class="mark-card"><div class="mark-label" id="obtained-marks-label">મેળવેલ ગુણ</div><div class="mark-value obtained" id="obtained-marks-val">0</div></div>
        </div>
        <div id="grade-badge" class="grade-badge"></div>
        <p id="result-message" style="font-size: 1rem; color: #cbd5e1; margin-bottom: 14px;"></p>
        <button class="action-btn" id="restart-btn" onclick="restartSameChapter()">🔄 આ જ ચેપ્ટર ફરીથી રમો</button>
        <button class="action-btn secondary-btn" id="menu-btn" onclick="backToMenu()">📚 બીજો વિષય / ચેપ્ટર પસંદ કરો</button>
    </div>
</div>
<div class="footer">Made with ❤️ by Het Patel | Smart Edu & Tech</div>

<script src="gseb_ss.js"></script>
<script src="gseb_sci.js"></script>
<script src="gseb_maths.js"></script>
<script src="gseb_eng.js"></script>
<script src="gseb_guj.js"></script>
<script src="cbse_ss.js"></script>
<script src="cbse_sci.js"></script>
<script src="cbse_maths.js"></script>
<script src="cbse_eng.js"></script>
<script>
    const quizDatabase = {
        GSEB: {
            "સામાજિક વિજ્ઞાન (Ch 1 to 23)": window.GSEB_SS || {},
            "વિજ્ઞાન (Ch 1 to 13)": window.GSEB_SCI || {},
            "ગણિત (Ch 1 to 14)": window.GSEB_MATHS || {},
            "ઇંગ્લિશ (Unit 1-10 & Poem 1-4)": window.GSEB_ENG || {},
            "ગુજરાતી (Ch 1 to 24)": window.GSEB_GUJ || {}
        },
        CBSE: {
            "Social Science (Ch 1 to 21)": window.CBSE_SS || {},
            "Science (Ch 1 to 13)": window.CBSE_SCI || {},
            "Mathematics (Ch 1 to 14)": window.CBSE_MATHS || {},
            "English (Ch 1-18 & Poem 1-10)": window.CBSE_ENG || {}
        }
    };

    let currentBoard = "GSEB";
    let currentQuestions = [];
    let currentQIndex = 0;
    let score = 0;

    const subjectSelect = document.getElementById("subject-select");
    const chapterSelect = document.getElementById("chapter-select");

    function selectBoard(board) {
        currentBoard = board;
        document.getElementById("btn-gseb").classList.toggle("active", board === "GSEB");
        document.getElementById("btn-cbse").classList.toggle("active", board === "CBSE");
        updateSubjects();
    }

    function updateSubjects() {
        const subjects = Object.keys(quizDatabase[currentBoard]);
        subjectSelect.innerHTML = "";
        subjects.forEach(sub => {
            const opt = document.createElement("option");
            opt.value = sub;
            opt.innerText = sub;
            subjectSelect.appendChild(opt);
        });
        updateChapters();
    }

    function updateChapters() {
        const selectedSub = subjectSelect.value;
        const chapters = Object.keys(quizDatabase[currentBoard][selectedSub] || {});
        chapterSelect.innerHTML = "";
        chapters.forEach(chap => {
            const opt = document.createElement("option");
            opt.value = chap;
            opt.innerText = chap;
            chapterSelect.appendChild(opt);
        });
    }

    function startQuiz() {
        const sub = subjectSelect.value;
        const chap = chapterSelect.value;
        currentQuestions = (quizDatabase[currentBoard][sub] && quizDatabase[currentBoard][sub][chap]) ? quizDatabase[currentBoard][sub][chap] : [];
        if (!currentQuestions.length) {
            alert("આ પ્રકરણના પ્રશ્નો લોડ થઈ રહ્યા છે, કૃપા કરીને થોડી સેકન્ડ પછી ફરી પ્રયાસ કરો.");
            return;
        }
        currentQIndex = 0;
        score = 0;

        document.getElementById("active-chapter-title").innerText = `${currentBoard} • ${sub} • ${chap}`;
        document.getElementById("score-counter").innerText = (currentBoard === "GSEB") ? `ગુણ: 0 / ${currentQuestions.length}` : `Marks: 0 / ${currentQuestions.length}`;
        document.getElementById("setup-area").style.display = "none";
        document.getElementById("result-box").style.display = "none";
        document.getElementById("quiz-area").style.display = "block";

        loadQuestion();
    }

    function loadQuestion() {
        const qData = currentQuestions[currentQIndex];
        const qLabel = (currentBoard === "GSEB") ? `પ્રશ્ન ${currentQIndex + 1} / ${currentQuestions.length}` : `Question ${currentQIndex + 1} / ${currentQuestions.length}`;
        document.getElementById("question-counter").innerText = qLabel;
        document.getElementById("progress-bar").style.width = `${(currentQIndex / currentQuestions.length) * 100}%`;
        document.getElementById("question-text").innerText = `${currentQIndex + 1}. ${qData.q}`;

        const optionsList = document.getElementById("options-list");
        optionsList.innerHTML = "";
        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        const labels = ["A", "B", "C", "D"];
        qData.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerHTML = `<strong>${labels[idx]}.</strong> ${opt}`;
            btn.onclick = () => checkAnswer(idx, btn);
            optionsList.appendChild(btn);
        });
    }

    function checkAnswer(selectedIdx, selectedBtn) {
        const qData = currentQuestions[currentQIndex];
        const allBtns = document.querySelectorAll(".option-btn");
        allBtns.forEach(b => b.disabled = true);

        if (selectedIdx === qData.ans) {
            selectedBtn.classList.add("correct");
            score++;
            document.getElementById("score-counter").innerText = (currentBoard === "GSEB") ? `ગુણ: ${score} / ${currentQuestions.length}` : `Marks: ${score} / ${currentQuestions.length}`;
        } else {
            selectedBtn.classList.add("wrong");
            allBtns[qData.ans].classList.add("correct");
        }

        const expBox = document.getElementById("explanation-box");
        const expLabel = (currentBoard === "GSEB") ? "સમજૂતી" : "Explanation";
        expBox.innerHTML = `💡 <strong>${expLabel}:</strong> ${qData.exp}`;
        expBox.style.display = "block";

        const nextBtn = document.getElementById("next-btn");
        nextBtn.style.display = "block";
        nextBtn.innerText = (currentQIndex === currentQuestions.length - 1)
            ? ((currentBoard === "GSEB") ? "રિઝલ્ટ જુઓ 🏆" : "View Result 🏆")
            : ((currentBoard === "GSEB") ? "આગળનો પ્રશ્ન ➔" : "Next Question ➔");
    }

    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex < currentQuestions.length) loadQuestion();
        else showResult();
    }

    function showResult() {
        document.getElementById("progress-bar").style.width = "100%";
        document.getElementById("quiz-area").style.display = "none";
        document.getElementById("result-box").style.display = "block";

        const totalMarks = currentQuestions.length;
        const percent = (score / totalMarks) * 100;

        document.getElementById("total-marks-val").innerText = totalMarks;
        document.getElementById("obtained-marks-val").innerText = score;

        const gradeBadge = document.getElementById("grade-badge");
        const msg = document.getElementById("result-message");
        gradeBadge.className = "grade-badge";

        if (currentBoard === "GSEB") {
            document.getElementById("result-title").innerText = "🎉 ક્વિઝ પૂર્ણ થઈ!";
            document.getElementById("total-marks-label").innerText = "કુલ ગુણ";
            document.getElementById("obtained-marks-label").innerText = "મેળવેલ ગુણ";
            document.getElementById("restart-btn").innerText = "🔄 આ જ ચેપ્ટર ફરીથી રમો";
            document.getElementById("menu-btn").innerText = "📚 બીજો વિષય / ચેપ્ટર પસંદ કરો";

            if (percent >= 90) { gradeBadge.innerText = "🌟 અદ્ભુત! (Excellent)"; gradeBadge.classList.add("grade-excellent"); msg.innerText = "તમારી બોર્ડ પરીક્ષાની તૈયારી ખૂબ જ ઉત્તમ છે!"; }
            else if (percent >= 75) { gradeBadge.innerText = "👏 ખૂબ જ સરસ! (Very Good)"; gradeBadge.classList.add("grade-good"); msg.innerText = "તમારું પ્રદર્શન ઘણું સારું છે. થોડા વધુ પ્રયત્નથી તમે ૧૦૦% ગુણ મેળવી શકો છો."; }
            else if (percent >= 50) { gradeBadge.innerText = "👍 સારો પ્રયાસ! (Nice)"; gradeBadge.classList.add("grade-nice"); msg.innerText = "તમે સારો પ્રયાસ કર્યો છે, હજુ થોડું વધુ વાંચન કરવાથી પરિણામ વધુ સુધરશે."; }
            else { gradeBadge.innerText = "📚 થોડી વધારે મહેનત કરવાની જરૂર છે!"; gradeBadge.classList.add("grade-workhard"); msg.innerText = "ચિંતા ન કરો! પાઠ્યપુસ્તકનું ધ્યાનથી વાંચન કરો અને ફરીથી આ ક્વિઝ રમો."; }
        } else {
            document.getElementById("result-title").innerText = "🎉 Quiz Completed!";
            document.getElementById("total-marks-label").innerText = "Total Marks";
            document.getElementById("obtained-marks-label").innerText = "Marks Obtained";
            document.getElementById("restart-btn").innerText = "🔄 Restart Same Chapter";
            document.getElementById("menu-btn").innerText = "📚 Select Another Subject / Chapter";

            if (percent >= 90) { gradeBadge.innerText = "🌟 Excellent!"; gradeBadge.classList.add("grade-excellent"); msg.innerText = "Outstanding performance! Your board exam preparation is top-notch."; }
            else if (percent >= 75) { gradeBadge.innerText = "👏 Very Good!"; gradeBadge.classList.add("grade-good"); msg.innerText = "Great job! Just a little more revision and you will score 100%."; }
            else if (percent >= 50) { gradeBadge.innerText = "👍 Nice!"; gradeBadge.classList.add("grade-nice"); msg.innerText = "Good effort! Review the explanations and try again to improve your score."; }
            else { gradeBadge.innerText = "📚 Needs a little more hard work!"; gradeBadge.classList.add("grade-workhard"); msg.innerText = "Don't worry! Read the NCERT chapter carefully and attempt the quiz again."; }
        }
    }

    function restartSameChapter() { startQuiz(); }
    function backToMenu() {
        document.getElementById("result-box").style.display = "none";
        document.getElementById("quiz-area").style.display = "none";
        document.getElementById("setup-area").style.display = "flex";
    }

    updateSubjects();
</script>
</body>
</html>
