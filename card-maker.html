<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Gujarati Greeting Card Maker | Het Patel</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Noto Sans Gujarati', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: white; min-height: 100vh; padding: 18px; display: flex; flex-direction: column; align-items: center; }
        .top-nav { width: 100%; max-width: 480px; display: flex; justify-content: space-between; margin-bottom: 15px; }
        .btn-home { text-decoration: none; color: #38bdf8; background: rgba(255,255,255,0.08); padding: 8px 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; border: 1px solid rgba(56,189,248,0.3); }
        h1 { font-size: 1.5rem; text-align: center; background: linear-gradient(to right, #facc15, #f472b6, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; }
        .form-box { width: 100%; max-width: 480px; background: #1e293b; padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 18px; display: flex; flex-direction: column; gap: 10px; }
        label { font-size: 0.85rem; color: #cbd5e1; font-weight: 600; }
        select, input, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: #0f172a; color: white; font-size: 0.95rem; outline: none; }
        select:focus, input:focus, textarea:focus { border-color: #facc15; }
        .canvas-wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        canvas { width: 100%; max-width: 400px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.2); }
        .btn-dl { width: 100%; max-width: 400px; padding: 14px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(16,185,129,0.4); }
        .btn-dl:active { transform: scale(0.98); }
    </style>
    <script data-goatcounter="https://goatcounter.com" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
    <div class="top-nav">
        <a href="index.html" class="btn-home">🏠 મુખ્ય વેબસાઇટ</a>
    </div>
    <h1>🎨 સ્માર્ટ ગુજરાતી & સ્કૂલ કાર્ડ મેકર</h1>

    <div class="form-box">
        <div>
            <label>પ્રસંગ પસંદ કરો (સામાન્ય & સ્કૂલ કાર્ડ્સ):</label>
            <select id="occasion" onchange="updatePreset()">
                <option value="🎓 પરીક્ષા માટે ખૂબ ખૂબ શુભેચ્છાઓ! ✍️">🎓 સ્કૂલ: પરીક્ષા શુભેચ્છા (All The Best)</option>
                <option value="👩‍🏫 શિક્ષક દિનની હાર્દિક શુભેચ્છાઓ! 🙏">👩‍🏫 સ્કૂલ: શિક્ષક દિન / ગુરુ વંદના</option>
                <option value="🏫 શાળા પ્રવેશોત્સવ — હાર્દિક સ્વાગત! 🎒">🏫 સ્કૂલ: શાળા પ્રવેશોત્સવ / નવું સત્ર</option>
                <option value="🇮🇳 રાષ્ટ્રીય પર્વની હાર્દિક શુભકામનાઓ! 🇮🇳">🇮🇳 સ્કૂલ: ૧૫ ઓગસ્ટ / ૨૬ જાન્યુઆરી</option>
                <option value="🎂 જન્મદિવસની ખૂબ ખૂબ શુભેચ્છાઓ!">🎂 જન્મદિવસ (Happy Birthday)</option>
                <option value="✨ આજનો સુવિચાર ✨">💡 આજનો સુવિચાર (Good Thought)</option>
                <option value="🏆 ખૂબ ખૂબ અભિનંદન! 🎉">🏆 અભિનંદન (Congratulations)</option>
                <option value="🙏 નૂતન વર્ષાભિનંદન! 🪔">🪔 તહેવાર શુભેચ્છા (Festival)</option>
            </select>
        </div>
        <div>
            <label>જેમને મોકલવું છે તેમનું નામ (વિદ્યાર્થી / શિક્ષક / મિત્ર):</label>
            <input type="text" id="toName" value="પ્રિય વિદ્યાર્થી મિત્રો" oninput="drawCard()">
        </div>
        <div>
            <label>શુભેચ્છા સંદેશ:</label>
            <textarea id="msgText" rows="2" oninput="drawCard()">આવનારી પરીક્ષામાં તમે શાંત ચિત્તે, આત્મવિશ્વાસ સાથે શ્રેષ્ઠ દેખાવ કરો અને ઉજ્જવળ સફળતા મેળવો એવી હાર્દિક શુભકામનાઓ!</textarea>
        </div>
        <div>
            <label>તમારું નામ (શિક્ષક / આચાર્ય / શુભેચ્છક):</label>
            <input type="text" id="fromName" value="મિનેશભાઈ પટેલ & હેત પટેલ" oninput="drawCard()">
        </div>
        <div>
            <label>શાળા / સંસ્થાનું નામ (વૈકલ્પિક):</label>
            <input type="text" id="schoolName" value="પ્રા.શાળા કુંભારી તલાવડી, બોરસદ" oninput="drawCard()">
        </div>
        <div>
            <label>કાર્ડનો રંગ (Theme):</label>
            <select id="theme" onchange="drawCard()">
                <option value="royal">🌌 રોયલ બ્લુ & ગોલ્ડ</option>
                <option value="sunset">🌅 પિંક & પર્પલ ગ્લો</option>
                <option value="emerald">🌿 ગ્રીન & ટીલ નેચર</option>
            </select>
        </div>
    </div>

    <div class="canvas-wrap">
        <canvas id="cardCanvas" width="800" height="800"></canvas>
        <button class="btn-dl" onclick="downloadCard()">⬇️ HD કાર્ડ ડાઉનલોડ કરો (PNG)</button>
    </div>

<script>
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');

    function updatePreset() {
        const occ = document.getElementById('occasion').value;
        const msg = document.getElementById('msgText');
        const toName = document.getElementById('toName');

        if (occ.includes('પરીક્ષા')) {
            toName.value = "પ્રિય વિદ્યાર્થી મિત્રો";
            msg.value = "આવનારી પરીક્ષામાં તમે શાંત ચિત્તે, આત્મવિશ્વાસ સાથે શ્રેષ્ઠ દેખાવ કરો અને ઉજ્જવળ સફળતા મેળવો એવી હાર્દિક શુભકામનાઓ!";
        } else if (occ.includes('શિક્ષક')) {
            toName.value = "આદરણીય ગુરુજનો";
            msg.value = "જ્ઞાનનો દીપ પ્રગટાવી વિદ્યાર્થીઓનું જીવન ઘડનાર દરેક ગુરુજનને શત શત વંદન અને શિક્ષક દિનની ખૂબ ખૂબ શુભેચ્છાઓ!";
        } else if (occ.includes('પ્રવેશોત્સવ')) {
            toName.value = "વ્હાલા બાળકો & વાલીશ્રીઓ";
            msg.value = "નવા શૈક્ષણિક વર્ષ અને શાળા પ્રવેશોત્સવ નિમિત્તે આપ સૌનું શાળા પરિવાર તરફથી હાર્દિક સ્વાગત છે!";
        } else if (occ.includes('રાષ્ટ્રીય')) {
            toName.value = "સૌ દેશવાસીઓ & વિદ્યાર્થીઓ";
            msg.value = "આપણા મહાન રાષ્ટ્રની એકતા, અખંડિતતા અને પ્રગતિ માટે સદા સમર્પિત રહીએ. રાષ્ટ્રીય પર્વની ખૂબ ખૂબ શુભકામનાઓ!";
        } else if (occ.includes('સુવિચાર')) {
            toName.value = "સુપ્રભાત";
            msg.value = "શિક્ષણ એ સૌથી શક્તિશાળી હથિયાર છે, જેનાથી તમે સમગ્ર વિશ્વને બદલી શકો છો — દરરોજ કંઈક નવું શીખતા રહો!";
        } else if (occ.includes('અભિનંદન')) {
            toName.value = "પ્રિય વિજેતા";
            msg.value = "તમારી આ શાનદાર સિદ્ધિ બદલ શાળા પરિવાર તરફથી ખૂબ ખૂબ અભિનંદન! ભવિષ્યમાં હજુ વધુ પ્રગતિ કરો એવી શુભેચ્છા.";
        } else if (occ.includes('નૂતન')) {
            toName.value = "સૌ સ્નેહીજનો";
            msg.value = "આ પાવન પર્વ તમારા જીવનમાં નવી ખુશીઓ, સમૃદ્ધિ અને ઉમંગ લઈને આવે એવી હાર્દિક શુભકામનાઓ!";
        } else {
            toName.value = "પ્રિય મિત્ર";
            msg.value = "ઈશ્વર તમને ઉત્તમ સ્વાસ્થ્ય, સુખ, શાંતિ અને દરેક ક્ષેત્રમાં અપાર સફળતા અર્પે એવી હાર્દિક શુભકામના!";
        }
        drawCard();
    }

    function wrapText(text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        for (let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, x, y);
    }

    function drawCard() {
        const theme = document.getElementById('theme').value;
        const occ = document.getElementById('occasion').value;
        const toName = document.getElementById('toName').value;
        const msg = document.getElementById('msgText').value;
        const fromName = document.getElementById('fromName').value;
        const schoolName = document.getElementById('schoolName').value;

        const grad = ctx.createLinearGradient(0, 0, 800, 800);
        if (theme === 'royal') { grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e3a8a'); }
        else if (theme === 'sunset') { grad.addColorStop(0, '#3b0764'); grad.addColorStop(1, '#9d174d'); }
        else { grad.addColorStop(0, '#064e3b'); grad.addColorStop(1, '#0f766e'); }

        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 800, 800);

        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 10;
        ctx.strokeRect(30, 30, 740, 740);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#fde047';
        ctx.font = 'bold 38px "Noto Sans Gujarati", sans-serif';
        ctx.fillText(occ, 400, 140);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 44px "Noto Sans Gujarati", sans-serif';
        ctx.fillText(toName, 400, 240);

        ctx.fillStyle = '#ffffff';
        ctx.font = '30px "Noto Sans Gujarati", sans-serif';
        wrapText(msg, 400, 340, 650, 48);

        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 32px "Noto Sans Gujarati", sans-serif';
        ctx.fillText("શુભેચ્છક: " + fromName, 400, 595);

        if (schoolName.trim() !== "") {
            ctx.fillStyle = '#a7f3d0';
            ctx.font = 'bold 26px "Noto Sans Gujarati", sans-serif';
            ctx.fillText("🏫 " + schoolName, 400, 655);
        }

        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '18px Poppins, sans-serif';
        ctx.fillText("Smart Edu & Tech • Het Patel", 400, 735);
    }

    function downloadCard() {
        const link = document.createElement('a');
        link.download = 'smart-school-greeting-card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    drawCard();
</script>
</body>
</html>
